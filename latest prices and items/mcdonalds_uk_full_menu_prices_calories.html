let activeSection = "all";

function tagHtml(tags) {
  if (!tags || !tags.length) return "";
  return tags.map(t => {
    if (t === "ltd") return '<span class="badge badge-ltd">LTD</span>';
    if (t === "new") return '<span class="badge badge-new">NEW</span>';
    if (t === "vegan") return '<span class="badge badge-vegan">VG</span>';
    if (t === "veg") return '<span class="badge badge-veg">V</span>';
    return "";
  }).filter((v,i,a) => a.indexOf(v) === i).join("");
}

function renderTabs() {
  const tabs = document.getElementById("tabs");
  const allTab = document.createElement("button");
  allTab.className = "tab active";
  allTab.textContent = "All";
  allTab.onclick = () => { activeSection = "all"; setActiveTab(allTab); filterMenu(); };
  tabs.appendChild(allTab);
  menuData.forEach(s => {
    const btn = document.createElement("button");
    btn.className = "tab";
    btn.textContent = s.title.split("(")[0].trim();
    btn.onclick = () => { activeSection = s.id; setActiveTab(btn); filterMenu(); };
    tabs.appendChild(btn);
  });
}

function setActiveTab(el) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  el.classList.add("active");
}

function filterMenu() {
  const q = document.getElementById("search").value.toLowerCase().trim();
  const content = document.getElementById("menu-content");
  content.innerHTML = "";
  let anyResults = false;

  menuData.forEach(section => {
    if (activeSection !== "all" && section.id !== activeSection) return;
    const filtered = section.items.filter(item =>
      !q || item.name.toLowerCase().includes(q)
    );
    if (!filtered.length) return;
    anyResults = true;

    const div = document.createElement("div");
    div.className = "section";
    div.innerHTML = `
      <div class="section-header">
        <span class="section-icon">${section.icon}</span>
        <span class="section-title">${section.title}</span>
        <span class="section-count">${filtered.length} item${filtered.length !== 1 ? "s" : ""}</span>
      </div>
      <table>
        <thead>
          <tr>
            <th>Item</th>
            <th>Price</th>
            <th>Calories</th>
          </tr>
        </thead>
        <tbody>
          ${filtered.map(item => `
            <tr>
              <td>${item.name}${tagHtml(item.tags)}</td>
              <td class="price">${item.price}</td>
              <td class="cal">${item.cal} kcal</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;
    content.appendChild(div);
  });

  if (!anyResults) {
    content.innerHTML = '<div class="no-results">No menu items found.</div>';
  }
}

renderTabs();
filterMenu();
</script>
